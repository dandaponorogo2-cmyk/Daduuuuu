<style>

function ldSt(){try{if(tg&&tg.initData&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')&&tg.CloudStorage){tg.CloudStorage.getItem('dd_st',(e,v)=>{if(!e&&v){try{st=JSON.parse(v)}catch(x){}}rSt()});return;}}catch(e){}const s=gL('dd_st');if(s){try{st=JSON.parse(s)}catch(e){}}rSt()}
function svSt(){const p=JSON.stringify(st);try{if(tg&&tg.initData&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')&&tg.CloudStorage)tg.CloudStorage.setItem('dd_st',p);else sL('dd_st',p);}catch(e){sL('dd_st',p)}rSt()}
function rSt(){$('wCnt').textContent=st.w;$('pCnt').textContent=st.p}
let mode='bot',p1=0,p2=0,rS=0,str=0,trn=1,rol=false,over=false,gid=0,rI=null,rT=null,bT=null;
let db=null,myId='p_'+Math.random().toString(36).slice(2,9),rCd=null,rRf=null,myRl=0,rDt=null,lR=0,lH=0,lRe=0;
function fb(){if(db)return db;if(!FIREBASE_DB_URL.trim()||typeof firebase==='undefined')return null;try{if(!firebase.apps.length)firebase.initializeApp({databaseURL:FIREBASE_DB_URL.trim()});return(db=firebase.database())}catch(e){return null}}
function d6(){try{if(window.crypto&&window.crypto.getRandomValues){const a=new Uint32Array(1),m=Math.floor(0x100000000/6)*6;let r;do{window.crypto.getRandomValues(a);r=a[0]}while(r>=m);return(r%6)+1}}catch(e){}return Math.floor(Math.random()*6)+1}
function pop(t,bg){const p=$('pop');p.textContent=t;p.style.background=bg;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}
function cnf(){['🌸','🎉','⭐','💎','✨'].forEach(ic=>{for(let j=0;j<4;j++){const e=document.createElement('div');e.className='cnf';e.textContent=ic;e.style.left=(Math.random()*94)+'vw';e.style.animationDuration=(1.4+Math.random())+'s';e.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}})}
function sts(m){$('sts').textContent=m}
function swMode(m){if(mode===m)return;lvRoom(0);mode=m;$('tBot').classList.toggle('active',m==='bot');$('tLoc').classList.toggle('active',m==='loc');$('tOnl').classList.toggle('active',m==='onl');$('onlP').classList.toggle('show',m==='onl');if(m==='onl'){const ok=!!fb();$('fbW').style.display=ok?'none':'block';$('lob').style.display=ok?'flex':'none';$('rmC').style.display='none';}rstLoc(0)}
function anim(id,frc,cb){clearInterval(rI);clearTimeout(rT);rol=true;ui();const b=$('dBx');b.classList.remove('bust');b.classList.add('roll');sTck();rI=setInterval(()=>{if(id!==gid){clearInterval(rI);return}b.textContent=EM[d6()];sTck()},75);rT=setTimeout(()=>{clearInterval(rI);rI=rT=null;if(id!==gid)return;const res=frc||d6();b.classList.remove('roll');b.textContent=EM[res];rol=false;try{cb(res)}finally{ui()}},420)}
function tapR(){if(mode==='onl'){if(!rDt)return;if(rDt.winner)rstOnl();else onlRoll();return}if(over)rstLoc(1);else locRoll()}
function tapD(){if(rol)return;if(mode==='onl'){if(!rDt||!rDt.p2Id)return;if(rDt.winner)rstOnl();else if(rDt.turn===myRl)onlRoll();return}if(over)rstLoc(1);else if(!(mode==='bot'&&trn===2))locRoll()}
function tapH(){mode==='onl'?onlHold():locHold()}
function tapRe(){if(mode==='onl'){if(rDt)rstOnl()}else rstLoc(0)}
function locRoll(){if(rol||over||(mode==='bot'&&trn===2))return;const id=gid,ap=trn,nm=ap===1?(mode==='bot'?tgN:'Pemain 1'):'Pemain 2';eAud();hap('impact','medium');anim(id,null,v=>{if(id!==gid)return;if(v===1){$('dBx').classList.add('bust');sBst();hap('notify','error');shk();mood(ap,'s',1400);pop('YABAI!! ZONK!','linear-gradient(135deg,#f43f5e,#be123c)');rS=0;str=0;trn=ap===1?2:1;if(mode==='bot'){sts('Yabai! Keluar ⚀ (1). Giliran Kitsune...');ui();bT=setTimeout(()=>botGo(id),1000)}else{sts(nm+' kena ⚀ (1)! Giliran Pemain '+trn+'!');ui()}}else{str++;sLnd(v,str);if(v>=5||str>=3)mood(ap,'h',1200);pop(v===6?'SUGOI!! +6 ★':(v===5?'NICE! +5':'+'+v),ap===1?'linear-gradient(135deg,#0ea5e9,#6366f1)':'linear-gradient(135deg,#ec4899,#a855f7)');rS+=v;sts(nm+' dapat '+EM[v]+' (+'+v+')! Lempar lagi atau Simpan?');ui()}})}
function locHold(){if(rol||over||!rS||(mode==='bot'&&trn===2))return;const id=gid;eAud();sHld();hap('impact','light');mood(trn,'h',1000);pop('SAFE! +'+rS,'linear-gradient(135deg,#10b981,#059669)');if(trn===1)p1+=rS;else p2+=rS;rS=0;str=0;if(p1>=TGT||p2>=TGT){endLoc(p1>=TGT?1:2);return}trn=trn===1?2:1;if(mode==='bot'){sts('Poin aman! Giliran Kitsune-Chan...');ui();bT=setTimeout(()=>botGo(id),850)}else{sts('Poin aman! Giliran Pemain '+trn+'.');ui()}}
function botGo(id){if(id!==gid||mode!=='bot'||trn!==2||over)return;anim(id,null,v=>{if(id!==gid||over)return;if(v===1){$('dBx').classList.add('bust');sBst();shk();mood(2,'s',1400);mood(1,'h',1000);pop('KITSUNE ZONK!','linear-gradient(135deg,#f43f5e,#be123c)');rS=0;str=0;trn=1;sts('Kitsune kena ⚀ (1)! Giliranmu!');ui();return}str++;sLnd(v,str);if(v>=5)mood(2,'h',1000);pop('+'+v,'linear-gradient(135deg,#ec4899,#a855f7)');rS+=v;ui();if(p2+rS>=TGT){sts('Kitsune menyimpan poin!');bT=setTimeout(()=>{if(id!==gid)return;sHld();p2+=rS;rS=0;str=0;endLoc(2)},700);return}if(rS>=(p1>=38?18:13)){sts('Kitsune memilih Simpan Poin.');bT=setTimeout(()=>{if(id!==gid)return;sHld();pop('SAFE +'+rS,'linear-gradient(135deg,#10b981,#059669)');p2+=rS;rS=0;str=0;trn=1;sts('Giliranmu! Ketuk dadu!');ui()},800)}else{sts('Kitsune dapat '+EM[v]+' (+'+v+'), melempar lagi...');bT=setTimeout(()=>botGo(id),850)}})}
function endLoc(w){over=true;str=0;st.p++;if(w===1){st.w++;sWin();cnf();hap('notify','success');mood(1,'h',0);mood(2,'s',0);$('p1C').classList.add('win');sts('🎉 VICTORY! '+(mode==='bot'?tgN:'Pemain 1').toUpperCase()+' menang ('+p1+' - '+p2+')!')}else{if(mode==='loc'){sWin();cnf()}else sLos();hap('notify','warning');mood(2,'h',0);mood(1,'s',0);$('p2C').classList.add('win');sts('🏆 '+(mode==='bot'?'Kitsune-Chan':'Pemain 2')+' menang ('+p2+' - '+p1+')!')}svSt();ui()}
function rstLoc(auto=0){gid++;clearInterval(rI);clearTimeout(rT);clearTimeout(bT);rI=rT=bT=null;p1=0;p2=0;rS=0;str=0;trn=1;rol=false;over=false;const b=$('dBx');b.classList.remove('roll','bust','p2m');b.textContent='🎲';$('p1C').classList.remove('win');$('p2C').classList.remove('win');mood(1,'n',0);mood(2,'n',0);sts(mode==='bot'?'Duel Anime vs Kitsune dimulai! Ketuk dadu!':(mode==='loc'?'Mode 2P (1 HP) siap! Giliran Pemain 1.':'Buat Room atau masukkan Kode 4 angka.'));ui();if(auto&&mode!=='onl')locRoll()}
function mkRoom(){const d=fb();if(!d)return;eAud();const c=String(Math.floor(1000+Math.random()*9000));d.ref('rooms/'+c).set({p1Name:tgN,p1Id:myId,p2Name:'',p2Id:'',p1Score:0,p2Score:0,roundScore:0,turn:1,lastDie:0,rollSeq:0,holdSeq:0,resetSeq:0,winner:0,status:'Menunggu teman masuk Room '+c+'...'}).then(()=>att(c,1)).catch(()=>sts('❌ Gagal buat room.'))}
function jnRoom(){const d=fb();if(!d)return;eAud();const c=($('rIn').value||'').trim();if(!/^\d{4}$/.test(c)){sts('Masukkan kode 4 angka.');return}const r=d.ref('rooms/'+c);r.once('value').then(s=>{const v=s.val();if(!v){sts('❌ Room '+c+' tidak ada.');return}if(v.p2Id&&v.p2Id!==myId&&v.p1Id!==myId){sts('❌ Room penuh.');return}const rl=v.p1Id===myId?1:2;if(rl===2&&!v.p2Id)r.update({p2Name:tgN,p2Id:myId,status:'🔥 '+tgN+' bergabung! Giliran '+v.p1Name+'.'}).then(()=>att(c,2));else att(c,rl)}).catch(()=>sts('❌ Gagal gabung.'))}
function att(c,rl){if(rRf)rRf.off();gid++;rCd=c;myRl=rl;lR=lH=lRe=0;$('lob').style.display='none';$('rmC').style.display='flex';$('rCode').textContent=c;rRf=db.ref('rooms/'+c);rRf.on('value',s=>{const v=s.val();if(v)onRm(v)})}
function lvRoom(rs=1){if(rRf){rRf.off();rRf=null}rCd=null;myRl=0;rDt=null;if(mode==='onl'){const ok=!!fb();$('lob').style.display=ok?'flex':'none';$('rmC').style.display='none';if(rs)rstLoc(0)}}
function shRoom(){if(!rCd)return;const t='🎲 Ayo Duel Dadu Anime bareng aku! Kode Room: '+rCd;if(tg&&tg.openTelegramLink)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent('https://t.me')+'&text='+encodeURIComponent(t));else if(navigator.clipboard){navigator.clipboard.writeText(rCd);sts('Kode '+rCd+' disalin!')}}
function onRm(d){const id=gid;if(d.resetSeq&&d.resetSeq!==lRe){lRe=d.resetSeq;lR=d.rollSeq||0;lH=d.holdSeq||0;rDt=d;str=0;$('dBx').classList.remove('bust','roll');$('dBx').textContent='🎲';$('p1C').classList.remove('win');$('p2C').classList.remove('win');mood(1,'n',0);mood(2,'n',0);apRm(d);return}if(d.rollSeq&&d.rollSeq!==lR&&d.lastDie){lR=d.rollSeq;rDt=d;anim(id,d.lastDie,v=>{if(id!==gid||mode!=='onl')return;if(v===1){$('dBx').classList.add('bust');sBst();shk();str=0;pop('YABAI!! ZONK!','linear-gradient(135deg,#f43f5e,#be123c)')}else{str++;sLnd(v,str);pop(v===6?'SUGOI!! +6 ★':'+'+v,'linear-gradient(135deg,#0ea5e9,#6366f1)')}apRm(d)});return}if(d.holdSeq&&d.holdSeq!==lH){lH=d.holdSeq;str=0;sHld();pop('SAFE!','linear-gradient(135deg,#10b981,#059669)')}rDt=d;apRm(d)}
function apRm(d){p1=d.p1Score||0;p2=d.p2Score||0;rS=d.roundScore||0;trn=d.turn||1;over=!!d.winner;sts(d.status||'');if(d.winner){$(d.winner===1?'p1C':'p2C').classList.add('win');mood(d.winner,'h',0);mood(d.winner===1?2:1,'s',0);if(d.winner===myRl){sWin();cnf();hap('notify','success')}else{sLos();hap('notify','warning')}}ui()}
function onlRoll(){if(!rRf||!rDt||!rDt.p2Id||rol||rDt.winner||rDt.turn!==myRl)return;eAud();hap('impact','medium');const v=d6(),me=myRl===1?rDt.p1Name:rDt.p2Name,ot=myRl===1?rDt.p2Name:rDt.p1Name;rRf.update(v===1?{lastDie:v,rollSeq:(rDt.rollSeq||0)+1,roundScore:0,turn:myRl===1?2:1,status:me+' kena ⚀ (1)! Giliran '+ot+'.'}:{lastDie:v,rollSeq:(rDt.rollSeq||0)+1,roundScore:(rDt.roundScore||0)+v,turn:myRl,status:me+' dapat '+EM[v]+' (+'+v+')!'})}
function onlHold(){if(!rRf||!rDt||!rDt.p2Id||rol||rDt.winner||rDt.turn!==myRl||!rDt.roundScore)return;eAud();hap('impact','light');const me=myRl===1?rDt.p1Name:rDt.p2Name,ot=myRl===1?rDt.p2Name:rDt.p1Name,n1=myRl===1?(rDt.p1Score||0)+rDt.roundScore:(rDt.p1Score||0),n2=myRl===2?(rDt.p2Score||0)+rDt.roundScore:(rDt.p2Score||0),w=n1>=TGT?1:(n2>=TGT?2:0);rRf.update({p1Score:n1,p2Score:n2,roundScore:0,holdSeq:(rDt.holdSeq||0)+1,winner:w,turn:w?myRl:(myRl===1?2:1),status:w?'🎉 '+me.toUpperCase()+' MENANG ('+n1+' - '+n2+')!':me+' simpan poin! Giliran '+ot+'.'})}
function rstOnl(){rRf&&rDt&&rRf.update({p1Score:0,p2Score:0,roundScore:0,turn:1,lastDie:0,winner:0,resetSeq:(rDt.resetSeq||0)+1,status:'Duel baru! Giliran '+rDt.p1Name+'.'})}
function ui(){$('p1N').textContent=mode==='bot'?tgN:(mode==='loc'?'SORA (P1)':(rDt?rDt.p1Name:'PEMAIN 1'));$('p2N').textContent=mode==='bot'?'KITSUNE BOT':(mode==='loc'?'KITSUNE (P2)':(rDt&&rDt.p2Name?rDt.p2Name:'MENUNGGU...'));$('p1S').textContent=p1;$('p2S').textContent=p2;$('rS').textContent=rS;$('p1B').style.width=Math.min(100,p1/TGT*100)+'%';$('p2B').style.width=Math.min(100,p2/TGT*100)+'%';$('p1C').classList.toggle('ap1',!over&&trn===1);$('p2C').classList.toggle('ap2',!over&&trn===2);$('dBx').classList.toggle('p2m',!over&&trn===2);const cp=$('cP'),ar=$('ar');if(str>=2&&!over){cp.textContent=str>=3?'🔥 FEVER x'+str:'⚡ COMBO x2';cp.classList.add('show');ar.classList.toggle('fev',str>=3)}else{cp.classList.remove('show');ar.classList.remove('fev')}const bR=$('bR'),bH=$('bH');if(mode==='onl'){const ok=rDt&&rDt.p2Id;if(rDt&&rDt.winner){bR.textContent='🎲 Main Lagi';bR.disabled=false;bH.disabled=true}else{bR.textContent='🎲 Lempar Dadu';const myT=ok&&rDt.turn===myRl&&!rol;bR.disabled=!myT;bH.disabled=!myT||!rDt.roundScore}}else if(over){bR.textContent='🎲 Main Lagi';bR.disabled=false;bH.disabled=true}else{bR.textContent='🎲 Lempar Dadu';const bt=mode==='bot'&&trn===2;bR.disabled=rol||bt;bH.disabled=rol||bt||rS===0}}
ldSt();ui();
