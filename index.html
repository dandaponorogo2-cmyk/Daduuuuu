<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Duel Dadu Anime - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-anime: linear-gradient(165deg, #160c2e 0%, #24134d 45%, #0f172a 100%);
      --glass: rgba(20, 16, 46, 0.72);
      --glass-border: rgba(255, 255, 255, 0.16);
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --cyan: #38bdf8;
      --pink: #f472b6;
      --gold: #fbbf24;
      --emerald: #34d399;
      --crimson: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #130b29;
      background-image: var(--bg-anime);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: calc(10px + var(--tg-safe-area-inset-top, 0px)) 12px calc(18px + var(--tg-safe-area-inset-bottom, 0px));
      overflow-x: hidden;
      position: relative;
    }

    /* Latar Belakang Sakura & Bintang Anime */
    .anime-sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .sakura {
      position: absolute;
      top: -30px;
      font-size: 16px;
      opacity: 0.55;
      filter: drop-shadow(0 0 6px rgba(244, 114, 182, 0.6));
      animation: sakuraFall linear infinite;
    }
    @keyframes sakuraFall {
      0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.65; }
      85% { opacity: 0.55; }
      100% { transform: translateY(105vh) translateX(45px) rotate(360deg); opacity: 0; }
    }

    .app {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    .app.screen-shake {
      animation: appShake 0.4s ease;
    }
    @keyframes appShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(6px, -3px); }
      60% { transform: translate(-4px, -2px); }
      80% { transform: translate(4px, 2px); }
    }

    /* Header Anime */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      backdrop-filter: blur(14px);
      padding: 10px 12px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .title-wrap h2 {
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #f472b6, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-wrap p {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 1px;
    }
    .header-right { display: flex; align-items: center; gap: 7px; }
    .stats-pill {
      background: rgba(244, 114, 182, 0.16);
      border: 1px solid rgba(244, 114, 182, 0.45);
      color: #fbcfe8;
      padding: 4px 9px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.3;
      text-align: right;
    }
    .btn-sound {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: 1.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Mode Selector */
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--glass);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
    }
    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 800;
      padding: 8px 4px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tab.active {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.4);
    }

    /* Online Panel */
    .online-panel {
      display: none;
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      border-radius: 15px;
      padding: 10px;
      flex-direction: column;
      gap: 8px;
    }
    .online-panel.show { display: flex; }
    .online-row { display: flex; gap: 7px; align-items: center; }
    .input-code {
      flex: 1;
      min-width: 0;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 3px;
    }
    .input-code::placeholder { letter-spacing: 0; font-weight: 500; color: #94a3b8; }
    .btn-mini {
      border: none;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-create { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-join { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
    .btn-share { background: rgba(56, 189, 248, 0.22); border: 1px solid var(--cyan); color: var(--cyan); }
    .btn-leave { background: rgba(251, 113, 133, 0.22); border: 1px solid var(--crimson); color: var(--crimson); }
    .room-badge { flex: 1; font-size: 13px; font-weight: 800; color: var(--gold); }
    .setup-warning {
      font-size: 11.5px;
      color: #fde68a;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 8px 10px;
      border-radius: 10px;
      line-height: 1.4;
    }

    /* Battle Scoreboard dengan Avatar Anime */
    .battle-board {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }
    .vs-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      font-style: italic;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.55);
      border: 2px solid #fff;
      z-index: 2;
    }
    .fighter-card {
      background: var(--glass);
      border: 2px solid var(--glass-border);
      border-radius: 16px;
      padding: 9px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .fighter-card.p2-card {
      flex-direction: row-reverse;
      text-align: right;
    }
    .fighter-card.active-p1 {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
      background: rgba(14, 165, 233, 0.14);
    }
    .fighter-card.active-p2 {
      border-color: var(--pink);
      box-shadow: 0 0 20px rgba(244, 114, 182, 0.35);
      background: rgba(236, 72, 153, 0.14);
    }
    .fighter-card.winner {
      border-color: var(--gold);
      box-shadow: 0 0 26px rgba(251, 191, 36, 0.5);
    }

    .avatar-wrap {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s;
    }
    .active-p1 .avatar-wrap, .active-p2 .avatar-wrap {
      transform: scale(1.06);
      border-color: #fff;
    }
    .avatar-svg { width: 100%; height: 100%; display: block; }
    .avatar-svg .eyes-hype, .avatar-svg .eyes-shock, .avatar-svg .fx-sweat, .avatar-svg .fx-sparkle { display: none; }
    .avatar-svg.mood-hype .eyes-normal { display: none; }
    .avatar-svg.mood-hype .eyes-hype, .avatar-svg.mood-hype .fx-sparkle { display: block; }
    .avatar-svg.mood-shock .eyes-normal { display: none; }
    .avatar-svg.mood-shock .eyes-shock, .avatar-svg.mood-shock .fx-sweat { display: block; }

    .fighter-info { flex: 1; min-width: 0; }
    .fighter-name {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }
    .fighter-score {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.05;
      margin: 2px 0 4px;
    }
    .fighter-score span { font-size: 11px; color: var(--text-sub); font-weight: 700; }

    .hp-track {
      width: 100%;
      height: 7px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .hp-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #0ea5e9, #38bdf8, #a5f3fc);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .hp-fill.p2 {
      background: linear-gradient(90deg, #f43f5e, #f472b6, #fde047);
    }

    /* Arena Dadu Sihir Anime */
    .arena {
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    /* Speedlines saat roll angka besar */
    .speed-lines {
      position: absolute;
      inset: -40%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 255, 255, 0.08) 0deg 4deg,
        transparent 4deg 14deg
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .arena.fever-fx .speed-lines {
      opacity: 1;
      animation: spinSlow 6s linear infinite;
    }

    .top-arena-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }
    .round-pill {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 5px 13px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .round-pill strong { color: var(--gold); font-size: 16px; margin-left: 4px; }

    .combo-pill {
      display: none;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.4px;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.6);
      animation: pulseBadge 0.8s infinite alternate;
    }
    .combo-pill.show { display: inline-block; }
    @keyframes pulseBadge {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    /* Lingkaran Sihir + Dadu */
    .dice-stage {
      position: relative;
      width: 146px;
      height: 146px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }
    .magic-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.6;
      animation: spinSlow 14s linear infinite;
      pointer-events: none;
    }
    .arena.fever-fx .magic-ring {
      opacity: 1;
      animation: spinSlow 4s linear infinite;
      filter: drop-shadow(0 0 10px #fbbf24);
    }
    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }

    .dice-box {
      width: 104px;
      height: 104px;
      background: linear-gradient(145deg, #38bdf8, #6366f1);
      color: #ffffff;
      border-radius: 26px;
      border: 2.5px solid rgba(255, 255, 255, 0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 68px;
      line-height: 1;
      font-family: 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols', sans-serif;
      box-shadow:
        0 12px 28px rgba(56, 189, 248, 0.42),
        inset 0 3px 6px rgba(255, 255, 255, 0.55),
        inset 0 -5px 10px rgba(0, 0, 0, 0.35);
      user-select: none;
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: background 0.25s, transform 0.12s, box-shadow 0.25s;
    }
    .dice-box:active { transform: scale(0.93); }
    .dice-box.p2-mode {
      background: linear-gradient(145deg, #f472b6, #a855f7);
      box-shadow:
        0 12px 28px rgba(244, 114, 182, 0.45),
        inset 0 3px 6px rgba(255, 255, 255, 0.55),
        inset 0 -5px 10px rgba(0, 0, 0, 0.35);
    }
    .dice-box.bust {
      background: linear-gradient(145deg, #fb7185, #be123c);
      box-shadow: 0 12px 30px rgba(244, 63, 94, 0.65);
      animation: bustShake 0.42s ease;
    }
    .dice-box.rolling { animation: rollTumble 0.26s infinite linear; }

    .pop-float {
      position: absolute;
      top: -6px;
      font-size: 16px;
      font-weight: 900;
      font-style: italic;
      padding: 4px 12px;
      border-radius: 99px;
      border: 2px solid #fff;
      pointer-events: none;
      opacity: 0;
      z-index: 5;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }
    .pop-float.show { animation: floatUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    .status-text {
      font-size: 13.5px;
      font-weight: 600;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
      z-index: 2;
      color: #f1f5f9;
    }

    /* Tombol Aksi */
    .controls { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; }
    .btn-action {
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-action:active:not(:disabled) { transform: scale(0.95); }
    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none !important; }
    .btn-roll {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.4);
    }
    .btn-hold {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.4);
    }
    .btn-restart {
      grid-column: 1 / -1;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 13px;
      cursor: pointer;
    }

    .confetti {
      position: fixed;
      top: -20px;
      font-size: 20px;
      pointer-events: none;
      z-index: 99;
      animation: fallDown 2.2s linear forwards;
    }

    @keyframes rollTumble {
      0% { transform: rotate(0deg) scale(1.05); }
      25% { transform: rotate(14deg) scale(1.1); }
      50% { transform: rotate(-14deg) scale(1.05); }
      75% { transform: rotate(10deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1.05); }
    }
    @keyframes bustShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-5deg); }
      40% { transform: translateX(8px) rotate(5deg); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(12px) scale(0.75); }
      20% { opacity: 1; transform: translateY(-6px) scale(1.12); }
      100% { opacity: 0; transform: translateY(-38px) scale(1); }
    }
    @keyframes fallDown {
      to { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Latar Sakura Anime -->
  <div class="anime-sky" id="animeSky"></div>

  <div class="app" id="appRoot">
    <!-- Header -->
    <div class="header">
      <div class="title-wrap">
        <h2 id="greeting">✨ Duel Dadu Anime</h2>
        <p>Target 50 Poin • Ketuk dadu untuk lempar</p>
      </div>
      <div class="header-right">
        <div class="stats-pill">
          🏆 <span id="winCount">0</span> Menang<br />
          🎮 <span id="playCount">0</span> Main
        </div>
        <button class="btn-sound" id="btnSound" type="button" onclick="toggleSound()">🔊</button>
      </div>
    </div>

    <!-- Pemilih Mode -->
    <div class="mode-tabs">
      <button class="mode-tab active" id="tabBot" type="button" onclick="switchMode('bot')">🤖 Lawan Bot</button>
      <button class="mode-tab" id="tabLocal" type="button" onclick="switchMode('local')">👥 2P (1 HP)</button>
      <button class="mode-tab" id="tabOnline" type="button" onclick="switchMode('online')">🌐 Online</button>
    </div>

    <!-- Panel Online -->
    <div class="online-panel" id="onlinePanel">
      <div id="firebaseWarning" class="setup-warning" style="display:none;">
        ⚙️ <b>Database Online belum diisi.</b> Tempel <code>FIREBASE_DB_URL</code> di kode <code>index.html</code> untuk mabar beda HP, atau pilih <b>👥 2P (1 HP)</b> untuk langsung main berdua!
      </div>
      <div id="lobbyControls" class="online-row">
        <button class="btn-mini btn-create" type="button" onclick="createOnlineRoom()">+ Buat Room</button>
        <input class="input-code" id="roomCodeInput" type="tel" maxlength="4" placeholder="Kode 4 angka" />
        <button class="btn-mini btn-join" type="button" onclick="joinOnlineRoom()">Gabung</button>
      </div>
      <div id="roomControls" class="online-row" style="display:none;">
        <div class="room-badge">Room: <span id="activeRoomCode">----</span></div>
        <button class="btn-mini btn-share" type="button" onclick="shareOnlineRoom()">📤 Ajak Teman</button>
        <button class="btn-mini btn-leave" type="button" onclick="leaveOnlineRoom(true)">Keluar</button>
      </div>
    </div>

    <!-- Papan Duel Anime (P1 vs P2) -->
    <div class="battle-board">
      <!-- Fighter 1: Sora -->
      <div class="fighter-card active-p1" id="p1Card">
        <div class="avatar-wrap">
          <svg class="avatar-svg" id="p1Avatar" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="p1Bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#0284c7" />
                <stop offset="100%" stop-color="#312e81" />
              </linearGradient>
              <linearGradient id="hairBlue" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#1d4ed8" />
              </linearGradient>
            </defs>
            <rect width="100" height="100" fill="url(#p1Bg)" />
            <!-- Rambut Belakang & Bahu -->
            <path d="M18 58 Q16 20 50 15 Q84 20 82 58 L86 88 L14 88 Z" fill="url(#hairBlue)" />
            <path d="M22 96 Q26 75 50 75 Q74 75 78 96 Z" fill="#0f172a" />
            <path d="M35 76 L50 89 L65 76" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
            <rect x="44" y="67" width="12" height="12" rx="4" fill="#fde2cc" />
            <!-- Wajah -->
            <path d="M29 45 Q29 24 50 24 Q71 24 71 45 Q71 64 50 72 Q29 64 29 45 Z" fill="#ffe8d6" />
            <ellipse cx="36" cy="56" rx="4.5" ry="2.2" fill="#fb7185" opacity="0.55" />
            <ellipse cx="64" cy="56" rx="4.5" r
